# Base de datos DESCARTABLE solo para las pruebas. No comparte nada con la base real:
# otro puerto, otro nombre, datos en memoria y claves de uso exclusivo de prueba (solo escucha en 127.0.0.1).
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   npm run test:aislamiento
#   docker compose -f docker-compose.test.yml down
services:
  db-test:
    image: mysql:8.0
    container_name: barberia-db-test
    environment:
      MYSQL_ROOT_PASSWORD: test-root
      MYSQL_DATABASE: barberia_test
      TZ: America/Argentina/Buenos_Aires
    command: --default-time-zone=-03:00 --character-set-server=utf8mb4
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./test/esquema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptest-root"]
      interval: 3s
      timeout: 3s
      retries: 30
